name: Update calendar

on:
  workflow_dispatch:
    inputs:
      planning:
        description: 'Planning'
        required: true
        type: string

  issues:
    types: [opened, closed]

permissions:
  contents: write
  issues: read

jobs:
  update-calendar:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, 'Dagplanning')

    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Get all open planning issues
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --state open \
            --json title,body \
            --jq '.[] | select(.title | startswith("Dagplanning")) | .body' \
            > planning.txt

      - name: Get manual planning
        if: github.event_name == 'workflow_dispatch'
        env:
          PLANNING: ${{ inputs.planning }}
        run: |
          printf '%s\n' "$PLANNING" > planning.txt

      - name: Update calendar file
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime
          import uuid

          planning = Path("planning.txt").read_text(encoding="utf-8")
          events = []

          for line in planning.splitlines():
              parts = [p.strip() for p in line.split("|")]

              if len(parts) != 4:
                  continue

              title, date, start_time, end_time = parts

              try:
                  start = datetime.strptime(
                      f"{date} {start_time}", "%Y-%m-%d %H:%M"
                  )
                  end = datetime.strptime(
                      f"{date} {end_time}", "%Y-%m-%d %H:%M"
                  )
              except ValueError:
                  continue

              events.append(
                  f"""BEGIN:VEVENT
          UID:{uuid.uuid4()}@dagplanning
          DTSTAMP:{datetime.utcnow().strftime("%Y%m%dT%H%M%SZ")}
          DTSTART:{start.strftime("%Y%m%dT%H%M%S")}
          DTEND:{end.strftime("%Y%m%dT%H%M%S")}
          SUMMARY:{title}
          END:VEVENT"""
              )

          calendar = """BEGIN:VCALENDAR
          VERSION:2.0
          PRODID:-//DAGPLANNING//NL
          """ + "\n".join(events) + """
          END:VCALENDAR
          """

          Path("Dagplanning.ics").write_text(calendar, encoding="utf-8")
          PY

      - name: Commit calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dagplanning.ics
          git diff --cached --quiet || git commit -m "Update calendar"
          git push